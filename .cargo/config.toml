[alias]
xtask = "run --release --locked --package xtask --"

[target.armv7-unknown-linux-gnueabi]
linker = "arm-linux-gnueabi-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[target.powerpc64le-unknown-linux-gnu]
linker = "powerpc64le-linux-gnu-gcc"

[target.s390x-unknown-linux-gnu]
linker = "s390x-linux-gnu-gcc"

[target.mips-unknown-linux-gnu]
linker = "mips-linux-gnu-gcc"

[target.mips64-unknown-linux-gnuabi64]
linker = "mips64-linux-gnuabi64-gcc"

[target.riscv64gc-unknown-linux-gnu]
# No musl cross toolchain is packaged for riscv64, so the VM runner uses the
# GNU target. Statically link so the binaries can run from the initramfs,
# which carries no dynamic loader.
linker = "riscv64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
